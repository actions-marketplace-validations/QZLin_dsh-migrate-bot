# The reusable workflow consumers call. It owns the job, the permissions and the
# concurrency group, so a consumer's workflow is only the triggers and one
# `uses:` line (examples/workflow.yml).
#
# The job runs the Action of this workflow's own release, named by version
# (commitizen bumps it): the major tag a consumer pins moves to a release whose
# workflow and Action agree, and a prerelease, which moves no major tag, runs
# its own Action too.
#
# No secret is mapped: a migration consults no model and needs only the
# workflow's own token.

name: dsh-migrate

on:
  workflow_call:
    inputs:
      target:
        description: "The dsh release to bump the plugins to: latest, a version such as 0.2.1-rc.2, or a dsh-v* tag; empty uses the target in the configuration"
        type: string
        required: false
        default: ''
      force:
        description: Bump again to a dsh release this repository was already bumped to, which is skipped otherwise; never while that release's proposal pull request is open
        type: boolean
        required: false
        default: false
      config:
        description: The configuration file, relative to the repository root
        type: string
        required: false
        default: .github/dsh-migrate.yml
    outputs:
      status:
        description: compatible, proposed, unpublished, failed, error, skipped, or the state an event left the migration in
        value: ${{ jobs.bump.outputs.status }}
      target_tag:
        description: The target release tag
        value: ${{ jobs.bump.outputs.target_tag }}
      verified_tag:
        description: The newest verified release tag
        value: ${{ jobs.bump.outputs.verified_tag }}
      pull_request_url:
        description: The proposal pull request, when there is one
        value: ${{ jobs.bump.outputs.pull_request_url }}

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  bump:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: dsh-migrate-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      status: ${{ steps.action.outputs.status }}
      target_tag: ${{ steps.action.outputs.target_tag }}
      verified_tag: ${{ steps.action.outputs.verified_tag }}
      pull_request_url: ${{ steps.action.outputs.pull_request_url }}
    steps:
      - uses: actions/checkout@v4
      - id: action
        uses: QZLin/dsh-migrate-bot@v3.1.0
        with:
          command: bump
          config: ${{ inputs.config }}
          target: ${{ inputs.target }}
          force: ${{ inputs.force }}
